services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
      POSTGRES_DB: outreach
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach"]
      interval: 2s
      timeout: 3s
      retries: 30
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://outreach:outreach@postgres:5432/outreach
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports: ["3000:3000"]
volumes:
  pgdata:
  ollama:
